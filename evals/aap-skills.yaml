name: aap-skills

# Asks two questions about the skills a server serves over SEP-2640:
# are they correctly constructed, and does a model actually use them?
#
# Construction is static — no model, no tokens — and runs on its own with
#   python main.py run aap-skills --construction-only
#
# Use is agentic: the server's `instructions` become the system prompt and the
# model gets a `read_resource` tool, which is what a conforming client would
# give it. Every check is a protocol event, never a judgement about prose.
#
# The server must be started with skills enabled:
#   SKILLS_ENABLED=true

transport: http
endpoint: ${MCP_ENDPOINT:-http://localhost:3000/mcp}
ssl_verify: false
headers:
  Authorization: "Bearer ${AAP_TOKEN}"

mode: skills
max_turns: 15

models:
  - anthropic:claude-sonnet-4-6

# One repeat by default: each case is a full agentic workflow, not a single
# tool pick. Raise it when measuring variance rather than conformance.
repeats: 1

# Construction is a conformance claim, so every check has to pass.
threshold: 1.0

test_cases:
  - id: SK01-health-check
    skill: aap-platform-health-check
    query: >
      Is my AAP platform healthy? Run the full diagnostics and give me the
      report.
    category: workflow

  - id: SK02-access-review
    skill: aap-effective-access-review
    query: >
      What effective access does the user 'admin' have, and which operations
      do their RBAC grants allow?
    category: workflow

# `aap-skill-creator` has no case here: it is an authoring aid, not an
# operational skill an end user reaches for. Construction still covers it,
# because the server serves it either way.
